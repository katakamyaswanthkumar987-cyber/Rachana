<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💖</title>

<style>
:root {
  --pink: #ff4d6d;
  --soft-pink: #fff0f3;
  --dark: #2b2b2b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: "Poppins", system-ui, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Floating hearts background */
.heart {
  position: absolute;
  color: rgba(255, 77, 109, 0.4);
  font-size: 20px;
  animation: float 8s linear infinite;
}

@keyframes float {
  from {
    transform: translateY(100vh) scale(0.5);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh) scale(1.2);
    opacity: 0;
  }
}

/* Card */
.card {
  background: white;
  width: 90%;
  max-width: 420px;
  padding: 32px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  position: relative;
}

.card h1 {
  color: var(--pink);
  margin-bottom: 8px;
}

.card p {
  color: #555;
}

/* Buttons */
.buttons {
  position: relative;
  height: 140px;
  margin-top: 30px;
}

button {
  padding: 14px 26px;
  border-radius: 999px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  position: absolute;
}

#yesBtn {
  background: var(--pink);
  color: white;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 12px 30px rgba(255,77,109,0.4);
}

#yesBtn:hover {
  transform: translateX(-50%) scale(1.1);
}

#noBtn {
  background: #dee2e6;
  color: #333;
  left: 60%;
  top: 60px;
}

/* Message */
.message {
  display: none;
  margin-top: 25px;
  font-size: 18px;
  color: var(--dark);
  animation: pop 0.6s ease forwards;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Confetti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? 💘</h1>
  <p>I promise unlimited smiles, laughs, and love 💕</p>

  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😶</button>
  </div>

  <div class="message" id="message">
    You just made my heart skip a beat 💓  
    Every moment with you feels like magic ✨  
    Happy Valentine’s Day ❤️
  </div>
</div>

<script>
/* Floating hearts generator */
for (let i = 0; i < 20; i++) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = 5 + Math.random() * 5 + "s";
  heart.style.fontSize = 16 + Math.random() * 24 + "px";
  document.body.appendChild(heart);
}

/* Button logic */
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.querySelector(".card");
const message = document.getElementById("message");

let yesScale = 1;

function moveNoButton() {
  const rect = card.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const maxX = rect.width - btnRect.width;
  const maxY = rect.height - btnRect.height - 80;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesScale += 0.08;
  yesBtn.style.transform = `translateX(-50%) scale(${yesScale})`;
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

/* YES clicked */
yesBtn.addEventListener("click", () => {
  message.style.display = "block";
  noBtn.style.display = "none";
  yesBtn.disabled = true;
  launchConfetti();
});

/* Confetti */
function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.top = "-10px";
    c.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
    c.style.animationDuration = 2 + Math.random() * 2 + "s";
    document.body.appendChild(c);

    setTimeout(() => c.remove(), 4000);
  }
}

/* Optional romantic music (uncomment to enable) */

const audio = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
audio.loop = true;
yesBtn.addEventListener("click", () => audio.play());
*/
</script>

</body>
</html>
